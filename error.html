<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noney BSNL | Error</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="background-glow" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>

  <div class="error-page-card">
    <div class="brand-pill">Gateway Error</div>
    <h1>Connection Failed</h1>
    <div class="error-code" id="errorCode">ERR_UNKNOWN</div>
    <p class="subcopy" id="errorMessage">We could not reach a healthy server.</p>
    <div class="error-meta">
      <div>Timestamp: <span id="errorTimestamp"></span></div>
      <div class="server-summary">
        <strong>Failed Servers</strong>
        <ul id="serverSummary"></ul>
      </div>
    </div>

    <div class="actions">
      <button type="button" onclick="window.location.href='index.html'">Try Again</button>
      <!--
        <button type="button" onclick="window.location.reload()">Refresh</button>
        -->
    </div>
  </div>

  <script type="module">
    import { populateErrorPage } from './js/ui.js';

    const params = new URLSearchParams(window.location.search);
    const detailsParam = params.get('details');
    let parsedDetails = {};

    try {
      parsedDetails = detailsParam ? JSON.parse(detailsParam) : {};
    } catch (error) {
      parsedDetails = {};
    }

    const details = {
      code: params.get('code') || 'ERR_UNKNOWN',
      message: params.get('message') || 'We could not reach a healthy server.',
      failedServers: Array.isArray(parsedDetails.failedServers) ? parsedDetails.failedServers : []
    };

    populateErrorPage(details, document.body);
  </script>
</body>
</html>
