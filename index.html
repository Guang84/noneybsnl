<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Noney BSNL</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/loader.css">
  <link rel="stylesheet" href="css/terminal.css">
  <link rel="stylesheet" href="css/modern.css">
</head>
<body>
  <div class="background-glow" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>

  <div class="container">
    <div class="brand-pill">Noney BSNL </div>
    <h1 id="mainMessage">Redirecting...</h1>
    <p class="subcopy" id="subMessage">Checking available servers...</p>

    <div class="loader-wrap" id="loaderWrap">
      <div class="loader" aria-hidden="true" style="width: 72px; height: 36px;"></div>
      <div class="loader-label" id="statusTextInline">Checking available servers…</div>
      <div class="loader-log-layer" id="terminalCard" aria-live="polite">
        <div class="loader-log-body" id="terminalBody"></div>
      </div>
    </div>

    <div class="countdown-card" id="countdownCard" style="display: none;">
      <span class="countdown-label">Redirecting in</span>
      <div class="countdown" id="countdown">5</div>
      <div class="countdown-progress" aria-hidden="true"><span id="countdownBar"></span></div>
    </div>

    <div class="error-message" id="errorMessage"></div>
    <div class="fallback" id="fallbackPage">
      <h2>All servers are currently offline.</h2>
      <p>Please try again later or check your connection.</p>
      <button onclick="window.location.reload()">Retry</button>
    </div>

  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
